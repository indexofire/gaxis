[workspace]
authors = ["indexofire <indexofire@gmail.com>"]
channels = ["conda-forge"]
name = "gaxis"
platforms = ["linux-64"]
version = "0.1.0"

[dependencies]
python = "3.12.*"
matplotlib-base = ">=3.8"
numpy = ">=1.26"
pydantic = ">=2.7"
typer = ">=0.12"
structlog = ">=24.1"
# R backend (M0): ggplot2 as a first-class renderer, not a later feature
r-base = ">=4.3"
r-ggplot2 = ">=3.5"
r-svglite = ">=2.1"
r-ragg = ">=1.3"
r-systemfonts = ">=1.0"
r-scales = ">=1.3"
# PDF parsing for the paper pipeline (M1)
pymupdf = ">=1.24"
# gbrain runtime (knowledge base, M3): TypeScript CLI executed by bun
bun = ">=1.2"


[feature.dev.dependencies]
pytest = ">=8"
ruff = ">=0.5"
mypy = ">=1.10"

[environments]
default = { features = ["dev"], solve-group = "default" }

[pypi-dependencies]
gaxis = { path = ".", editable = true }
mcp = ">=1.2"
mkdocs-material = ">=9.5"
mkdocs-static-i18n = ">=1.2"
snakemake = ">=8"

[tasks]
gbrain-install = "bash scripts/install_gbrain.sh"
gbrain-init = "bash scripts/gbrain_init.sh"
gbrain-doctor = "bash scripts/gbrain_doctor.sh"
gbrain = "bash scripts/gbrain.sh"
check = { cmd = "ruff check . && ruff format --check . && mypy src && pytest -q", depends-on = [] }
fmt = "ruff format . && ruff check --fix ."
test = "pytest -q"
docs-serve = "mkdocs serve"
docs-build = "mkdocs build --strict"
review = "python scripts/review_matrix.py"
render-demo = "gaxis render --data examples/demo/expr.tsv --chart bar --x genotype --y expr_fpkm --hue condition --preset nature_microbiology --out data/demo"
render-demo-r = "gaxis render --data examples/demo/expr.tsv --chart bar --x genotype --y expr_fpkm --hue condition --backend r --preset asm --out data/demo-r"
